name: Signature 357 public-Magma residual frontier

concurrency:
  group: signature357-public-magma-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - agent/signature-345-357-certificates
    paths:
      - "scripts/run_signature_357_magma_mod5_residual_spaces.py"
      - "scripts/run_signature_357_magma_fixed7_residual_space.py"
      - "scripts/produce_signature_357_mod5_complete_local.py"
      - "Research/Signature357/odd_p7_twist.json"
      - "Research/Signature357/signature357_remaining_frontier.json"
      - ".github/workflows/signature357_mod5_magma_levels.yml"
  pull_request:
    paths:
      - "scripts/run_signature_357_magma_mod5_residual_spaces.py"
      - "scripts/run_signature_357_magma_fixed7_residual_space.py"
      - "scripts/produce_signature_357_mod5_complete_local.py"
      - "Research/Signature357/odd_p7_twist.json"
      - "Research/Signature357/signature357_remaining_frontier.json"
      - ".github/workflows/signature357_mod5_magma_levels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mod5-residual-space:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {e3: 2, e7: 2, norm: 35721, prime: 13}
          - {e3: 2, e7: 2, norm: 35721, prime: 29}
          - {e3: 2, e7: 2, norm: 35721, prime: 41}
          - {e3: 2, e7: 2, norm: 35721, prime: 43}
          - {e3: 3, e7: 2, norm: 964467, prime: 13}
          - {e3: 3, e7: 2, norm: 964467, prime: 29}
          - {e3: 3, e7: 2, norm: 964467, prime: 41}
          - {e3: 3, e7: 2, norm: 964467, prime: 43}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install PARI/GP
        run: |
          sudo apt-get update
          sudo apt-get install -y pari-gp
      - name: Produce complete local mod-5 HGM candidate polynomials
        run: >-
          python3 scripts/produce_signature_357_mod5_complete_local.py
          > mod5-complete-local.json
      - name: Test the residual Hecke module
        run: >-
          python3 scripts/run_signature_357_magma_mod5_residual_spaces.py
          --local-data mod5-complete-local.json
          --pair "${{ matrix.e3 }},${{ matrix.e7 }}"
          --prime "${{ matrix.prime }}"
          > "mod5-residual-${{ matrix.norm }}-${{ matrix.prime }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: signature357-mod5-residual-${{ matrix.norm }}-${{ matrix.prime }}
          path: |
            mod5-complete-local.json
            mod5-residual-${{ matrix.norm }}-${{ matrix.prime }}.json
          if-no-files-found: error

  fixed7-residual-space:
    strategy:
      fail-fast: false
      matrix:
        prime: [11, 13, 17, 19, 29, 31, 41, 59, 61, 71]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Test level-(3,3) in the residual Hecke module
        run: >-
          python3 scripts/run_signature_357_magma_fixed7_residual_space.py
          --prime "${{ matrix.prime }}"
          > "fixed7-residual-${{ matrix.prime }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: signature357-fixed7-residual-${{ matrix.prime }}
          path: "fixed7-residual-${{ matrix.prime }}.json"
          if-no-files-found: error
