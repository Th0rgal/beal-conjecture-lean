name: Signature 357 public-Magma residual frontier

concurrency:
  group: signature357-public-magma-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - agent/signature-345-357-certificates
    paths:
      - "scripts/run_signature_357_magma_mod5_residual_spaces.py"
      - "scripts/run_signature_357_magma_fixed7_residual_space.py"
      - "scripts/run_signature_357_magma_joint_5103.py"
      - "scripts/run_signature_357_magma_even5103_trace.py"
      - "scripts/produce_signature_357_joint_hgm.py"
      - "scripts/produce_signature_357_mod5_complete_local.py"
      - ".github/workflows/signature357_mod5_magma_levels.yml"
  pull_request:
    paths:
      - "scripts/run_signature_357_magma_mod5_residual_spaces.py"
      - "scripts/run_signature_357_magma_fixed7_residual_space.py"
      - "scripts/run_signature_357_magma_joint_5103.py"
      - "scripts/run_signature_357_magma_even5103_trace.py"
      - "scripts/produce_signature_357_joint_hgm.py"
      - "scripts/produce_signature_357_mod5_complete_local.py"
      - ".github/workflows/signature357_mod5_magma_levels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  even5103-traces:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Compute the final even-branch packet traces
        run: >-
          python3 scripts/run_signature_357_magma_even5103_trace.py
          > even5103-traces.json
      - uses: actions/upload-artifact@v4
        with:
          name: signature357-even5103-traces
          path: even5103-traces.json
          if-no-files-found: error

  mod5-residual-space:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {e3: 3, e7: 0, norm: 19683}
          - {e3: 2, e7: 2, norm: 35721}
          - {e3: 3, e7: 1, norm: 137781}
          - {e3: 3, e7: 2, norm: 964467}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install PARI/GP
        run: |
          sudo apt-get update
          sudo apt-get install -y pari-gp
      - name: Produce complete local mod-5 HGM candidate polynomials
        run: >-
          python3 scripts/produce_signature_357_mod5_complete_local.py
          > mod5-complete-local.json
      - name: Filter the residual Hecke module
        run: >-
          python3 scripts/run_signature_357_magma_mod5_residual_spaces.py
          --local-data mod5-complete-local.json
          --pair "${{ matrix.e3 }},${{ matrix.e7 }}"
          > "mod5-residual-${{ matrix.norm }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: signature357-mod5-residual-${{ matrix.norm }}
          path: |
            mod5-complete-local.json
            mod5-residual-${{ matrix.norm }}.json
          if-no-files-found: error

  odd-joint-5103:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install PARI/GP
        run: |
          sudo apt-get update
          sudo apt-get install -y pari-gp
      - name: Produce parameter-labelled joint HGM traces
        run: >-
          python3 scripts/produce_signature_357_joint_hgm.py
          > joint-hgm-traces.json
      - name: Produce complete local mod-5 traces
        run: >-
          python3 scripts/produce_signature_357_mod5_complete_local.py
          > mod5-complete-local.json
      - name: Test the two odd-branch modular pairs
        run: >-
          python3 scripts/run_signature_357_magma_joint_5103.py
          --joint-data joint-hgm-traces.json
          --mod5-local mod5-complete-local.json
          > joint-5103.json
      - uses: actions/upload-artifact@v4
        with:
          name: signature357-odd-joint-5103
          path: |
            joint-hgm-traces.json
            mod5-complete-local.json
            joint-5103.json
          if-no-files-found: error

  fixed7-residual-space:
    strategy:
      fail-fast: false
      matrix:
        prime: [11, 13, 17, 19, 29, 31, 41, 59, 61, 71]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Test level-(3,3) in the residual Hecke module
        run: >-
          python3 scripts/run_signature_357_magma_fixed7_residual_space.py
          --prime "${{ matrix.prime }}"
          > "fixed7-residual-${{ matrix.prime }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: signature357-fixed7-residual-${{ matrix.prime }}
          path: "fixed7-residual-${{ matrix.prime }}.json"
          if-no-files-found: error
