name: Global Beal exponent reduction

on:
  push:
    branches:
      - agent/global-beal-prime-reduction
  pull_request:
    paths:
      - "BealUnified/ExponentReduction.lean"
      - "Research/GlobalBeal/**"
      - "Research/Signature3511/**"
      - "scripts/check_global_beal_*.py"
      - "scripts/check_signature_3511_*.py"
      - ".github/workflows/global_beal_reduction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Replay prime-exponent reduction
        run: |
          python3 scripts/check_global_beal_prime_exponent_reduction.py --self-test
          python3 scripts/check_global_beal_prime_exponent_reduction.py
      - name: Replay repeated-exponent audit
        run: |
          python3 scripts/check_global_beal_repeated_exponent_audit.py --self-test
          python3 scripts/check_global_beal_repeated_exponent_audit.py
      - name: Replay signature-(3,5,11) mod-5 irreducibility at 3
        run: |
          python3 scripts/check_signature_3511_mod5_irreducibility_at3.py --self-test
          python3 scripts/check_signature_3511_mod5_irreducibility_at3.py

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Compile exponent reduction module explicitly
        id: exponent-reduction
        run: |
          set +e
          lake env lean BealUnified/ExponentReduction.lean > lean-exponent-reduction.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat lean-exponent-reduction.log
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-beal-exponent-reduction-lean-log
          path: lean-exponent-reduction.log
          if-no-files-found: error
      - name: Fail on Lean compilation error
        if: steps.exponent-reduction.outputs.status != '0'
        run: exit 1
