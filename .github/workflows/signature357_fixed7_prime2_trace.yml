name: Signature 357 universal fixed7 trace at 2

on:
  push:
    branches:
      - research/signature357-final-e3-3-probe
    paths:
      - "scripts/run_signature_357_magma_fixed7_prime2_trace.py"
      - "scripts/run_signature_357_magma_fixed7_24_28_prime2.py"
      - ".github/workflows/signature357_fixed7_prime2_trace.yml"
  pull_request:
    paths:
      - "scripts/run_signature_357_magma_fixed7_prime2_trace.py"
      - "scripts/run_signature_357_magma_fixed7_24_28_prime2.py"
      - ".github/workflows/signature357_fixed7_prime2_trace.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signature357-universal-fixed7-prime2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  level33:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Test the full level-(3,3) trace-six kernel
        run: >-
          python3 scripts/run_signature_357_magma_fixed7_prime2_trace.py
          > fixed7-level33-prime2.json
      - uses: actions/upload-artifact@v4
        with:
          name: signature357-fixed7-level33-prime2
          path: fixed7-level33-prime2.json
          if-no-files-found: error

  packets24-28:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Audit packets 24 and 28 independently of mod-5 parity
        run: >-
          python3 scripts/run_signature_357_magma_fixed7_24_28_prime2.py
          > fixed7-packets24-28-prime2.json
      - uses: actions/upload-artifact@v4
        with:
          name: signature357-fixed7-packets24-28-prime2
          path: fixed7-packets24-28-prime2.json
          if-no-files-found: error
