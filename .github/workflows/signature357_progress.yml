name: Signature 357 progress certificates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile new checkers
        run: |
          python3 -m py_compile \
            scripts/check_signature_357_fixed7_level23.py \
            scripts/check_signature_357_joint_hgm.py \
            scripts/check_signature_357_ray_hasse.py \
            scripts/check_signature_357_mod5_even_conductor_at7.py \
            scripts/check_signature_357_mod5_branch_levels.py \
            scripts/check_signature_357_odd_e3_sync.py \
            scripts/check_signature_357_odd_fixed7_level23.py \
            scripts/check_signature_357_lmfdb_low_levels.py
      - run: python3 scripts/check_signature_357_fixed7_level23.py --self-test
      - run: python3 scripts/check_signature_357_fixed7_level23.py
      - run: python3 scripts/check_signature_357_joint_hgm.py --self-test
      - run: python3 scripts/check_signature_357_joint_hgm.py
      - run: python3 scripts/check_signature_357_ray_hasse.py --self-test
      - run: python3 scripts/check_signature_357_ray_hasse.py
      - run: python3 scripts/check_signature_357_mod5_even_conductor_at7.py --self-test
      - run: python3 scripts/check_signature_357_mod5_even_conductor_at7.py
      - run: python3 scripts/check_signature_357_mod5_branch_levels.py --self-test
      - run: python3 scripts/check_signature_357_mod5_branch_levels.py
      - run: python3 scripts/check_signature_357_odd_e3_sync.py --self-test
      - run: python3 scripts/check_signature_357_odd_e3_sync.py
      - run: python3 scripts/check_signature_357_odd_fixed7_level23.py --self-test
      - run: python3 scripts/check_signature_357_odd_fixed7_level23.py
      - run: python3 scripts/check_signature_357_lmfdb_low_levels.py --self-test
      - run: python3 scripts/check_signature_357_lmfdb_low_levels.py
