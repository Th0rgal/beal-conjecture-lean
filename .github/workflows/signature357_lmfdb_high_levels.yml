name: Signature 357 LMFDB high-level probe

concurrency:
  group: signature357-lmfdb-high-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - agent/signature-345-357-certificates
    paths:
      - "scripts/fetch_signature_357_lmfdb_high_levels.py"
      - "scripts/fetch_signature_357_rational_base_change.py"
      - ".github/workflows/signature357_lmfdb_high_levels.yml"
  pull_request:
    paths:
      - "scripts/fetch_signature_357_lmfdb_high_levels.py"
      - "scripts/fetch_signature_357_rational_base_change.py"
      - ".github/workflows/signature357_lmfdb_high_levels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m pip install --disable-pip-version-check "psycopg[binary]==3.2.9"
      - name: Query remaining Hilbert levels in the LMFDB mirror
        run: >-
          python3 scripts/fetch_signature_357_lmfdb_high_levels.py
          > lmfdb-high-levels.json
      - name: Inventory every rational base-change source supported at 3 and 7
        run: >-
          python3 scripts/fetch_signature_357_rational_base_change.py
          > rational-base-change.json
      - uses: actions/upload-artifact@v4
        with:
          name: signature357-lmfdb-high-levels
          path: |
            lmfdb-high-levels.json
            rational-base-change.json
          if-no-files-found: error
