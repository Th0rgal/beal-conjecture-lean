name: Signature 357 LMFDB research fetch

on:
  push:
    branches:
      - agent/signature-345-357-certificates
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-lowest-level:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/fetch_signature_357_lmfdb.py > signature357-lmfdb-level729.json
      - uses: actions/upload-artifact@v4
        with:
          name: signature357-lmfdb-level729
          path: signature357-lmfdb-level729.json
          if-no-files-found: error
