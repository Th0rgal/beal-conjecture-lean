name: Signature 357 LMFDB research fetch

on:
  push:
    branches:
      - agent/signature-345-357-certificates
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-covered-levels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/signature-345-357-certificates
      - name: Install public-mirror client
        run: python3 -m pip install --disable-pip-version-check "psycopg[binary]==3.2.9"
      - name: Query complete low-level HMF frontier
        run: >-
          python3 scripts/fetch_signature_357_lmfdb_sql.py
          > Research/Signature357/lmfdb_low_levels.json
      - uses: actions/upload-artifact@v4
        with:
          name: signature357-lmfdb-low-levels
          path: Research/Signature357/lmfdb_low_levels.json
          if-no-files-found: error
      - name: Pin canonical LMFDB response
        run: |
          if git diff --quiet -- Research/Signature357/lmfdb_low_levels.json; then
            echo "LMFDB response already pinned"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Research/Signature357/lmfdb_low_levels.json
          git commit -m "Pin LMFDB-covered signature-357 levels"
          git push origin HEAD:agent/signature-345-357-certificates
