name: Signature 357 isolated odd e3=3 norm-8 probes

concurrency:
  group: signature357-isolated-mod5-e3-3
  cancel-in-progress: true

on:
  push:
    branches:
      - agent/signature357-mod5-e3-3-run
    paths:
      - "scripts/run_signature_357_magma_mod5_combined_semilinear.py"
      - "scripts/run_signature_357_magma_mod5_norm8_probe.py"
      - ".github/workflows/signature357_mod5_combined_semilinear_v2.yml"
  pull_request:
    paths:
      - "scripts/run_signature_357_magma_mod5_combined_semilinear.py"
      - "scripts/run_signature_357_magma_mod5_norm8_probe.py"
      - ".github/workflows/signature357_mod5_combined_semilinear_v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  norm8:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {e3: 3, e7: 0, norm: 19683}
          - {e3: 3, e7: 1, norm: 137781}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Compute the mandatory norm-8 residual kernel
        run: >-
          python3 scripts/run_signature_357_magma_mod5_norm8_probe.py
          --pair "${{ matrix.e3 }},${{ matrix.e7 }}"
          > "mod5-norm8-${{ matrix.norm }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: signature357-mod5-norm8-${{ matrix.norm }}
          path: "mod5-norm8-${{ matrix.norm }}.json"
          if-no-files-found: error
