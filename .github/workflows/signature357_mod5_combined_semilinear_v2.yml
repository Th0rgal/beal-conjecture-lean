name: Signature 357 isolated odd e3=3 mod5 residual sieves

concurrency:
  group: signature357-isolated-mod5-e3-3
  cancel-in-progress: true

on:
  push:
    branches:
      - agent/signature357-mod5-e3-3-run
    paths:
      - "scripts/run_signature_357_magma_mod5_combined_semilinear.py"
      - "scripts/run_signature_357_magma_mod5_combined_semilinear_v2.py"
      - "Research/Signature357/ODD_REMOVED_PRIME7_TRACE_BREAKTHROUGH.md"
      - ".github/workflows/signature357_mod5_combined_semilinear_v2.yml"
  pull_request:
    paths:
      - "scripts/run_signature_357_magma_mod5_combined_semilinear.py"
      - "scripts/run_signature_357_magma_mod5_combined_semilinear_v2.py"
      - "Research/Signature357/ODD_REMOVED_PRIME7_TRACE_BREAKTHROUGH.md"
      - ".github/workflows/signature357_mod5_combined_semilinear_v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {e3: 3, e7: 0, norm: 19683}
          - {e3: 3, e7: 1, norm: 137781}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install PARI/GP
        run: |
          sudo apt-get update
          sudo apt-get install -y pari-gp
      - name: Produce split-prime local HGM traces
        run: >-
          python3 scripts/produce_signature_357_mod5_complete_local.py
          > mod5-split-local.json
      - name: Produce inert-prime local HGM traces
        run: >-
          python3 scripts/produce_signature_357_mod5_inert_local.py
          > mod5-inert-local.json
      - name: Intersect removed-prime, local and semilinear conditions
        run: >-
          python3 scripts/run_signature_357_magma_mod5_combined_semilinear_v2.py
          --split-data mod5-split-local.json
          --inert-data mod5-inert-local.json
          --pair "${{ matrix.e3 }},${{ matrix.e7 }}"
          > "mod5-combined-v2-${{ matrix.norm }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: signature357-mod5-combined-v2-${{ matrix.norm }}
          path: |
            mod5-split-local.json
            mod5-inert-local.json
            mod5-combined-v2-${{ matrix.norm }}.json
          if-no-files-found: error
