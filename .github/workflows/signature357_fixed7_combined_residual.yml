name: Signature 357 isolated fixed7 prime-11 marginal sieve

concurrency:
  group: signature357-isolated-fixed7-level33
  cancel-in-progress: true

on:
  push:
    branches:
      - agent/signature357-fixed7-level33-run
    paths:
      - "scripts/run_signature_357_magma_fixed7_combined_residual.py"
      - "scripts/run_signature_357_magma_fixed7_prime11_marginal.py"
      - ".github/workflows/signature357_fixed7_combined_residual.yml"
  pull_request:
    paths:
      - "scripts/run_signature_357_magma_fixed7_combined_residual.py"
      - "scripts/run_signature_357_magma_fixed7_prime11_marginal.py"
      - ".github/workflows/signature357_fixed7_combined_residual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prime11:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Apply the cheapest fixed-7 local trace obstruction
        run: >-
          python3 scripts/run_signature_357_magma_fixed7_prime11_marginal.py
          > fixed7-prime11-marginal-33.json
      - uses: actions/upload-artifact@v4
        with:
          name: signature357-fixed7-prime11-marginal-33
          path: fixed7-prime11-marginal-33.json
          if-no-files-found: error
