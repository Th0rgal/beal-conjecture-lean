name: Signature 357 final odd e3=3 low-memory probes

on:
  push:
    branches:
      - research/signature357-final-e3-3-probe
    paths:
      - "scripts/run_signature_357_magma_fixed7_prime11_marginal.py"
      - "scripts/run_signature_357_magma_mod5_norm8_probe.py"
      - ".github/workflows/signature357_final_e3_3_probe.yml"
  pull_request:
    paths:
      - "scripts/run_signature_357_magma_fixed7_prime11_marginal.py"
      - "scripts/run_signature_357_magma_mod5_norm8_probe.py"
      - ".github/workflows/signature357_final_e3_3_probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signature357-final-e3-3-low-memory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Apply the cheapest fixed-7 level-(3,3) local obstruction
        run: >-
          python3 scripts/run_signature_357_magma_fixed7_prime11_marginal.py
          > fixed7-prime11-marginal-33.json
      - name: Compute the level-19683 norm-8 residual kernel
        run: >-
          python3 scripts/run_signature_357_magma_mod5_norm8_probe.py
          --pair "3,0"
          > mod5-norm8-19683.json
      - name: Compute the level-137781 norm-8 residual kernel
        run: >-
          python3 scripts/run_signature_357_magma_mod5_norm8_probe.py
          --pair "3,1"
          > mod5-norm8-137781.json
      - uses: actions/upload-artifact@v4
        with:
          name: signature357-final-e3-3-low-memory-probes
          path: |
            fixed7-prime11-marginal-33.json
            mod5-norm8-19683.json
            mod5-norm8-137781.json
          if-no-files-found: error
