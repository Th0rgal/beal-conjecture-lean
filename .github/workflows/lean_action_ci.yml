name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      # docgen-action deploys to GitHub Pages on push, which fails with 404
      # while Pages is disabled on this repo. Keep the docs build as a
      # pull_request check only until Pages is enabled.
      - uses: leanprover-community/docgen-action@v1
        if: github.event_name == 'pull_request'
